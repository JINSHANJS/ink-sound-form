name: Publish artwork
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify complete browser bundle
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json
          page = Path("web/my_work/object_3d/ink_sound_form")
          assert 'browser-processing.js?v=2' in (page / "字-音-像.html").read_text()
          runtime = page / "browser-runtime"
          for name, digest in json.loads((runtime / "bundle-manifest.json").read_text())["files"].items():
              assert hashlib.sha256((runtime / name).read_bytes()).hexdigest() == digest, name
          for name in ("extract.py", "solidify.py", "solidify_tables.py"):
              assert (page / "browser-python" / name).read_bytes() == (Path("backend") / name).read_bytes(), name
          PYCODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
