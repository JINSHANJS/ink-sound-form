name: Publish browser preview
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("web/my_work/object_3d/scroll/字-音-像.html")
          html = page.read_text()
          page.write_text(html.replace("</body>", '<script src="pages-preview.js"></script>\n</body>'))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
