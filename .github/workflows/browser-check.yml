name: Verify full browser artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "tools/check-browser.mjs", ".github/workflows/browser-check.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise the actual static artwork without a Python processing server
        run: node tools/check-browser.mjs
